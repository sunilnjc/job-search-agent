# Manual until the owner has reviewed/approved a dispatch. No deploy or secrets.
name: Full offline regression gate
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Existing PostgreSQL runtime (no shared service)
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/psql
          /usr/lib/postgresql/16/bin/postgres --version
      - name: Install declared test dependencies (no provider calls)
        run: |
          python -m pip install '.[web]'
          npm ci --prefix web --ignore-scripts
      - name: Full serial Python and real SQL gate
        env:
          JOBPURSUIT_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: python -B scripts/regression_gate.py --summary regression-result.json --timeout 600
      - name: Full serial frontend unit regression
        if: ${{ !cancelled() }}
        working-directory: web
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Production frontend build (clean checkout; no deployment)
        if: ${{ !cancelled() }}
        working-directory: web
        run: npm run build
      - name: Regression evidence (counts only; no billable artifact/cache storage)
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('regression-result.json').read_text(encoding='utf-8')
          print(source)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('## Offline regression gate\n\n```json\n' + source + '\n```\n')
          PY
